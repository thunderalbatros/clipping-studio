name: Clipping Studio CI Gate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  static-and-unit-gate:
    name: Ruff, ty Ratchet, Pytest & Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        run: |
          set -euo pipefail
          GITLEAKS_VER="8.24.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact

      - name: Setup uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install lightweight CI dependencies (zero VOD downloads)
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python \
            "pydantic>=2.14.0" \
            "pyyaml>=6.0.4" \
            "python-dotenv>=1.2.0" \
            "numpy>=2.5.0" \
            "pillow>=13.0.0" \
            "psutil>=7.0.0" \
            "pysubs2>=1.9.1" \
            "curl-cffi>=0.17.0" \
            "requests>=2.34.0" \
            "safehttpx<=0.1.7" \
            "tenacity>=9.1.0" \
            "websockets>=17.4" \
            "sqlite-vec>=0.1.6" \
            "chonkie>=1.7.0" \
            "fastembed>=0.9.0" \
            "qdrant-client>=1.16.0" \
            "ffmpeg-normalize>=1.45.0" \
            "onnxruntime==1.32.0" \
            "scenedetect>=0.6.7" \
            "opencv-python-headless>=4.11.0" \
            "google-genai>=2.30.0,<3.0.0" \
            "pydantic-ai-slim[google,groq]>=2.71.0" \
            "pydantic-evals>=2.71.0" \
            "openai>=3.57.0" \
            "pytest>=8.3.0" \
            "ruff>=0.17.0" \
            "ty"

      - name: Ruff lint check
        run: .venv/bin/ruff check src/ evals/ tests/ scripts/

      - name: ty static type check (global src/)
        run: .venv/bin/ty check src/

      - name: Pytest unit test suite
        run: .venv/bin/pytest tests/ -v
