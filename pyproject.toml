[project]
name = "clipping-studio"
version = "3.5.2"
description = "Automated Senior-grade 9:16 & 16:9 viral clipping studio (anti-AI slop, 1080p60, Motion-Graphics Alpha, PySceneDetect, Scene-Match Intelligence, LR-ASD, YAMNet ONNX, Federated RAG, DesignEngine)"
requires-python = ">=3.12"
dependencies = [
    "auto-editor>=29.0.0",
    "curl-cffi>=0.17.0",
    "fastembed>=0.9.0",
    "google-genai>=2.30.0,<3.0.0",
    "huggingface-hub>=1.30.0",
    "numpy>=2.5.0",
    "onnx-asr>=0.12.0",
    "onnxruntime>=1.32.0",
    "openai>=3.57.0",
    "opencv-python-headless>=4.11.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.0",
    "pydantic-ai-slim[google,groq]>=2.71.0",
    "pysubs2>=1.9.1",
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0.4",
    "rembg>=2.0.80",
    "requests>=2.34.0",
    "scenedetect>=0.6.7",
    "sqlite-vec>=0.1.6",
    "tenacity>=9.1.0",
    "websockets>=17.4",
    "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.17.0",
]

[project.scripts]
clipping-studio = "src.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 128

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "FURB", "RUF"]
ignore = ["E501", "RUF001", "RUF005", "UP047"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
