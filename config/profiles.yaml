# Clipping Studio — Cloud-First Compute Profiles (v4.0-B1, validated via pydantic-settings extra="forbid")
# Canonical planes: local_control (HP 250 G8 ingest/control/QA) vs gcp_cloud_run_l4 (Cloud Run Jobs NVIDIA L4).

default_profile: "local_control"

profile_aliases:
  local_hp: "local_control"
  gcp_spot_l4: "gcp_cloud_run_l4"
  colab_t4: "gcp_cloud_run_l4"

profiles:
  local_control:
    profile_id: "local_control"
    description: "HP 250 G8 Control + Residential Ingest + Lightweight QA (CPU ONNX int8 + Intel QuickSync h264_qsv, $0/mo)"
    plane: "control_and_ingest"
    device: "cpu"
    dtype: "int8"
    attn_implementation: "sdpa"
    asr_primary: "nvidia/parakeet-tdt-0.6b-v3"
    asr_backend: "onnx-asr"
    video_encoder: "h264_qsv"
    video_encoder_fallback: "libx264"
    pixel_format: "nv12"
    llm_primary: "vertex_ai"
    llm_fallback_ladder: ["groq", "openrouter"]
    heavy_gpu_models_enabled: false
    network_timeout_sec: 15.0
    max_job_timeout_minutes: 30

  gcp_cloud_run_l4:
    profile_id: "gcp_cloud_run_l4"
    description: "GCP Cloud Run Jobs GPU Worker (NVIDIA L4 24GB sm_89, us-central1, --no-gpu-zonal-redundancy, scale-to-$0)"
    plane: "gpu_worker"
    device: "cuda"
    dtype: "bfloat16"
    attn_implementation: "sdpa"
    asr_primary: "faster-whisper-large-v3-turbo"
    asr_backend: "ctranslate2-cuda"
    video_encoder: "h264_nvenc"
    video_encoder_fallback: "libx264"
    pixel_format: "yuv420p"
    llm_primary: "vertex_ai"
    llm_fallback_ladder: ["groq", "openrouter"]
    heavy_gpu_models_enabled: true
    network_timeout_sec: 20.0
    max_job_timeout_minutes: 15
