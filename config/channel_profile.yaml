# Clipping Studio — Channel & Runtime Defaults (v4.0-B1, validated via pydantic-settings extra="forbid")
# Zero dead keys: every field below is validated by src/settings.py and wired into runtime modules.

studio:
  default_niche: "gaming_gta6"
  default_language: "en"
  monetization_goal: "cpm_bounty" # cpm_bounty | ypp_bridge | editorial
  voice_mode: "none" # none (Bounties CPM) | human_batch (Shure SM58) | tts

clip_rules:
  min_duration_sec: 16.0
  max_duration_sec: 58.0
  min_reviewer_score: 0.75
  max_review_retries: 1
  cut_silence_over_sec: 0.65
  preserve_synchresis_pause_sec: 0.25

layout_9_16:
  fps: 60
  preserve_source_fps: true
  max_webcam_upscale: 1.8
  webcam_exclusion_pad_px: 48
  rms_punch_in_max_zoom: 1.15

captions:
  font_name: "Montserrat Black"
  font_size: 68
  uppercase: true
  max_words_per_chunk: 3
  max_chars_per_chunk: 16
  primary_color: "&H00FFFFFF"
  highlight_color: "&H0000FFFF"
  impact_color: "&H0055FF00"
  outline_width: 6.0
  shadow: 3.0
  pos_x: 540
  pos_y: 1120
  skip_npc_dialogue: true

audio:
  target_lufs: -14.0
  true_peak_dbtp: -1.0
  highpass_hz: 70
  sample_rate: 48000

storage:
  runs_max_gb: 4.0
  auto_cleanup_temp: true
